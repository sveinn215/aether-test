openapi: 3.0.0
info:
  title: Restful-booker API
  description: API documentation for the playground API restful-booker.
  version: 1.0.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: https://restful-booker.herokuapp.com
security:
  - basicAuth: []
  - cookieAuth: []
paths:
  /auth:
    post:
      operationId: createToken
      summary: CreateToken
      description: Creates a new auth token to use for access to the PUT and DELETE /booking
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
        '400':
          description: Bad Request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  default: admin
                password:
                  type: string
                  default: password123
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string

  /booking:
    get:
      operationId: getBookingIds
      summary: GetBookingIds
      description: Returns the ids of all the bookings that exist within the API.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    bookingid:
                      type: integer
        '400':
          description: Bad Request
      parameters:
        - name: firstname
          in: query
          schema:
            type: string
        - name: lastname
          in: query
          schema:
            type: string
        - name: checkin
          in: query
          schema:
            type: string
            format: date
        - name: checkout
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    bookingid:
                      type: integer
    post:
      operationId: createBooking
      summary: CreateBooking
      description: Creates a new booking in the API
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  bookingid:
                    type: integer
                  booking:
                    $ref: '#/components/schemas/Booking'
        '400':
          description: Bad Request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Booking'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  bookingid:
                    type: integer
                  booking:
                    $ref: '#/components/schemas/Booking'

  /booking/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: getBookingById
      summary: GetBooking
      description: Returns a specific booking based upon the booking id provided
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          description: Bad Request
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
    put:
      operationId: updateBooking
      summary: UpdateBooking
      description: Updates a current booking. Requires Auth.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          description: Bad Request
      security:
        - cookieAuth: []
        - basicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Booking'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
    patch:
      operationId: partialUpdateBooking
      summary: PartialUpdateBooking
      description: Updates a current booking with a partial payload. Requires Auth.
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
      security:
        - cookieAuth: []
        - basicAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                firstname:
                  type: string
                lastname:
                  type: string
      responses:
        '200':
          description: OK
    delete:
      operationId: deleteBooking
      summary: DeleteBooking
      description: Deletes a booking from the API. Requires Auth.
      responses:
        '201':
          description: Created
        '400':
          description: Bad Request
      security:
        - cookieAuth: []
        - basicAuth: []
      responses:
        '201':
          description: Created

  /ping:
    get:
      operationId: healthCheck
      summary: HealthCheck
      description: A simple health check endpoint.
      responses:
        '201':
          description: Created
        '400':
          description: Bad Request
      responses:
        '201':
          description: Created

components:
  schemas:
    Booking:
      type: object
      properties:
        firstname:
          type: string
        lastname:
          type: string
        totalprice:
          type: integer
        depositpaid:
          type: boolean
        bookingdates:
          type: object
          properties:
            checkin:
              type: string
              format: date
            checkout:
              type: string
              format: date
        additionalneeds:
          type: string
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    cookieAuth:
      type: apiKey
      in: header
      name: Cookie